# Render Blueprint for the LeatherWallah backend (Express + TS + Mongo + S3).
#
# HOW TO USE
#   1. Push this file to GitHub (it lives at LeatherWallahBackend/render.yaml).
#   2. Render → New → Blueprint → pick the LeatherWallah repo.
#      Render reads this file and creates the service below.
#   3. Fill in the env vars marked `sync: false` from your local
#      LeatherWallahBackend/.env (they are NOT committed — see .gitignore).
#      MONGO_URI, ACCESS_TOKEN, all S3_*, PATHAO_*, STEADFAST_*, SSLCOMMERZ_*,
#      META_*, TIKTOK_*, BULKSMS_*, FRAUDBD_API_KEY, etc.
#   4. Set CORS_ORIGINS to your deployed frontend + admin URLs, comma-separated:
#        https://<frontend>.vercel.app,https://<admin>.vercel.app
#   5. Set FRONTEND_PUBLIC_URL / BACKEND_PUBLIC_URL to the live URLs once known.
#
# NOTE: rootDir points Render at the backend subfolder so build/start run there.
# The free plan sleeps after ~15 min idle; first request after sleep is slow
# (~30-50s) but the nightly node-cron still runs while the instance is awake.

services:
  - type: web
    name: leatherwallah-backend
    runtime: node
    plan: free
    rootDir: LeatherWallahBackend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render provides PORT automatically; index.ts reads process.env.PORT.
      # Comma-separated https origins for the deployed frontend + admin.
      - key: CORS_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: SITE_TITLE
        sync: false
      - key: SITE_URL
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      # S3 (DigitalOcean/Contabo)
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # Couriers
      - key: STEADFAST_API_KEY
        sync: false
      - key: STEADFAST_SECRET_KEY
        sync: false
      - key: PATHAO_WEBHOOK_SECRET
        sync: false
      - key: PATHAO_BASE_URL
        sync: false
      - key: PATHAO_CLIENT_ID
        sync: false
      - key: PATHAO_CLIENT_SECRET
        sync: false
      - key: PATHAO_CLIENT_EMAIL
        sync: false
      - key: PATHAO_CLIENT_PASSWORD
        sync: false
      - key: PATHAO_STORE_ID
        sync: false
      # Fraud + analytics CAPI
      - key: FRAUDBD_API_KEY
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_TEST_EVENT_CODE
        sync: false
      - key: TIKTOK_PIXEL_ID
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      # SMS + payment gateway
      - key: BULKSMS_API_KEY
        sync: false
      - key: BULKSMS_SENDER_ID
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
